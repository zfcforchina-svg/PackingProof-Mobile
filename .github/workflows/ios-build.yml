name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v 2>&1 | tee doctor.log

      - name: Pub get
        run: flutter pub get 2>&1 | tee pubget.log

      - name: Precache iOS
        run: flutter precache --ios 2>&1 | tee precache.log

      - name: Fix Xcode project
        run: |
          gem install xcodeproj --no-document 2>&1 | tee gem.log
          ruby Tools/fix-ios-project.rb 2>&1 | tee fixproject.log

      - name: Try building (capture full output)
        run: |
          set +e
          flutter build ios --debug --no-codesign --verbose 2>&1 | tee build.log
          BUILD_EXIT=$?
          echo "Build exit code: $BUILD_EXIT" >> build.log
          exit 0

      - name: Show key errors from build log
        run: |
          echo "=== Compile Errors ==="
          grep -i "error:" build.log | head -30 || echo "No compile errors found"
          echo ""
          echo "=== Failed Steps ==="
          grep -i "failed\|FAILED\|fatal\|BUILD FAILED" build.log | head -20 || echo "No failures"
          echo ""
          echo "=== Last 30 lines ==="
          tail -30 build.log

      - name: Package IPA if available
        run: |
          for path in "build/ios/Debug-iphoneos/Runner.app" "build/ios/iphoneos/Runner.app" "build/ios/Release-iphoneos/Runner.app"; do
            if [ -d "$path" ]; then
              echo "Found: $path"
              mkdir -p Payload
              cp -R "$path" Payload/
              zip -r -y PackingProof-Mobile-iOS.ipa Payload
              rm -rf Payload
              echo "IPA created"
              break
            fi
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: |
            *.log
            PackingProof-Mobile-iOS.ipa
          retention-days: 7
