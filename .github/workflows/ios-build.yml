name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          gem install cocoapods --no-document
          pod install

      - name: Install xcodeproj gem
        run: gem install xcodeproj --no-document

      - name: Fix Xcode project (add iOS native Swift files)
        run: ruby Tools/fix-ios-project.rb

      - name: Build iOS app (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package as unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/Release-iphoneos/Runner.app Payload/
          zip -r -y PackingProof-Mobile-iOS.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PackingProof-Mobile-iOS
          path: PackingProof-Mobile-iOS.ipa
          retention-days: 30
