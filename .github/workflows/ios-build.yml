name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Fix Xcode project (add iOS native Swift files)
        working-directory: ios
        run: ruby ../Tools/fix-ios-project.rb

      - name: Add Privacy Manifest for required reasons
        run: |
          RUBY_SCRIPT=$(cat << 'RUBY_SCRIPT'
          require 'xcodeproj'
          project_path = 'ios/Runner.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          target = project.targets.select { |t| t.name == 'Runner' }.first
          target.build_configurations.each do |config|
            config.build_settings['SWIFT_VERSION'] ||= '5.0'
            config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] ||= '15.0'
          end
          project.save
          RUBY_SCRIPT
          )
          gem install xcodeproj --no-document
          ruby -e "$RUBY_SCRIPT"

      - name: Build iOS app (unsigned)
        run: |
          flutter build ios --release --no-codesign --target-platform=ios-arm64

      - name: Package as unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/Release-iphoneos/Runner.app Payload/
          zip -r -y PackingProof-Mobile-iOS.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PackingProof-Mobile-iOS
          path: PackingProof-Mobile-iOS.ipa
          retention-days: 30

      - name: Upload build summary
        if: always()
        run: |
          echo "## iOS Build Result" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
