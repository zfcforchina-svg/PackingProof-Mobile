name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Pub get
        run: flutter pub get

      - name: Precache iOS
        run: flutter precache --ios

      - name: Fix Xcode project
        run: |
          gem install xcodeproj --no-document
          ruby Tools/fix-ios-project.rb

      - name: Build iOS (debug, no codesign)
        run: flutter build ios --debug --no-codesign

      - name: Package IPA
        run: |
          APP_PATH="build/ios/Debug-iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH="build/ios/iphoneos/Runner.app"
          fi
          ls -la "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -y PackingProof-Mobile-iOS.ipa Payload
          rm -rf Payload
          ls -la PackingProof-Mobile-iOS.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: PackingProof-Mobile-iOS
          path: PackingProof-Mobile-iOS.ipa
          retention-days: 30
